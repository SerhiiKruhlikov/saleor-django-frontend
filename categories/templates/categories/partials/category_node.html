{# categories/templates/categories/partials/category_node.html #}
<li>
    <a href="{% url 'categories:detail' slug=category.slug %}">{{ category.name }}</a>
    {% if category.children %}
        <ul>
            {% for child in category.children %}
                {% include "categories/partials/category_node.html" with category=child %}
            {% endfor %}
        </ul>
    {% endif %}
</li>
