{# shop/templates/shop/partials/menu_node.html #}
<li>
  <a href="{% url 'router:dynamic_router' slug=category.slug %}">{{ category.name }}</a>
  {% if category.children %}
    <ul>
      {% for child in category.children %}
        {% include "shop/partials/menu_node.html" with category=child %}
      {% endfor %}
    </ul>
  {% endif %}
</li>
