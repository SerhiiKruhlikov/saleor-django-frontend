{# templates/partials/menu.js.html #}
<script>window.SDF_PREFIX = "{{ LOCALSTORAGE_PREFIX }}";</script>
<script>
    (function () {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMenu);
        } else {
            initMenu();
        }

        function initMenu() {
            const topLevelLinks = document.querySelectorAll('.menu > li > a');

            topLevelLinks.forEach(function (link) {
                const subMenu = link.nextElementSibling;
                if (subMenu && subMenu.tagName === 'UL') {
                    link.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const parentLi = this.parentElement;
                        const isOpen = parentLi.classList.contains('open');

                        document.querySelectorAll('.menu > li.open').forEach(function (li) {
                            li.classList.remove('open');
                        });

                        if (!isOpen) {
                            parentLi.classList.add('open');
                        }
                    });
                }
            });

            document.addEventListener('click', function (e) {
                if (e.target.closest('.menu li.open > ul')) return;
                document.querySelectorAll('.menu > li.open').forEach(function (li) {
                    li.classList.remove('open');
                });
            });
        }
    })();
</script>
<script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
